<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주유소 최저가 찾기</title>
<style>
  body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 0; color: #333; }
  .header { background: #2563eb; color: white; padding: 20px; text-align: center; font-weight: bold; }
  .controls { background: white; padding: 15px; border-bottom: 1px solid #ddd; }
  .btn-group { display: flex; gap: 5px; margin-bottom: 10px; }
  .btn { flex: 1; padding: 10px; border: 1px solid #ddd; background: white; cursor: pointer; border-radius: 5px; }
  .btn.active { background: #2563eb; color: white; border-color: #2563eb; }
  .info { padding: 10px 15px; font-size: 13px; background: #e9ecef; display: flex; justify-content: space-between; }
  .list { padding: 15px; }
  .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
  .price { font-size: 22px; font-weight: bold; color: #e11d48; }
  .error-box { padding: 20px; color: #b91c1c; background: #fee2e2; border-radius: 10px; margin: 15px; line-height: 1.5; font-size: 14px; }
</style>
</head>
<body>
<div class="header">⛽ 주변 최저가 주유소</div>
<div class="controls">
  <div class="btn-group">
    <button class="btn active" onclick="setFuel('B027', this)">휘발유</button>
    <button class="btn" onclick="setFuel('D047', this)">경유</button>
    <button class="btn" onclick="setFuel('K015', this)">LPG</button>
  </div>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <span>반경: <b id="rTxt">1km</b></span>
    <input type="range" min="1" max="5" value="1" oninput="setRange(this)" style="flex:1; margin-left:15px;">
  </div>
</div>
<div class="info"><span id="loc">위치 확인 중...</span><button onclick="init()">📡 갱신</button></div>
<div id="content"></div>

<script>
let lat, lng, fuel='B027', radius=1;
function setFuel(f, b) { document.querySelectorAll('.btn').forEach(btn=>btn.classList.remove('active')); b.classList.add('active'); fuel=f; if(lat) load(); }
function setRange(e) { radius=e.value; document.getElementById('rTxt').innerText=radius+'km'; if(lat) load(); }

function init() {
  navigator.geolocation.getCurrentPosition(p => {
    lat=p.coords.latitude; lng=p.coords.longitude;
    document.getElementById('loc').innerText = `내 위치: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    load();
  }, () => { document.getElementById('content').innerHTML = '<div class="error-box">위치 권한이 필요합니다.</div>'; });
}

async function load() {
  const cont = document.getElementById('content');
  cont.innerHTML = '<div style="text-align:center; padding:40px;">데이터 로딩 중...</div>';
  try {
    const res = await fetch(`/.netlify/functions/gas?lat=${lat}&lng=${lng}&radius=${radius}&fuel=${fuel}`);
    const data = await res.json();
    if (data.error) {
      cont.innerHTML = `<div class="error-box"><b>⚠️ 실패:</b> ${data.error}<br><br><small>상세정보: ${JSON.stringify(data.debug || '')}</small></div>`;
      return;
    }
    let html = '';
    data.forEach(s => {
      html += `<div class="card">
        <div style="display:flex; justify-content:space-between;">
          <b>${s.name}</b> <span class="price">${s.price.toLocaleString()}원</span>
        </div>
        <div style="font-size:12px; color:gray; margin-top:5px;">거리: ${(s.dist/1000).toFixed(1)}km | ${s.isSelf?'셀프':''} ${s.is24h?'24시':''}</div>
      </div>`;
    });
    cont.innerHTML = html || '<div style="text-align:center; padding:40px;">주변에 주유소가 없습니다.</div>';
  } catch(e) { cont.innerHTML = '<div class="error-box">서버 통신 실패</div>'; }
}
window.onload = init;
</script>
</body>
</html>
